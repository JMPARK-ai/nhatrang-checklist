<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>나트랑 여행 준비물 · 일정 · 지도</title>
<!-- 홈 화면 추가(PWA): 아이콘 + 주소창 없는 전체화면 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon.png">
<meta name="theme-color" content="#0E8C7F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121B19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="나트랑">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#24312E; --sub:#6E7F7A;
  --line:#E9E9E9; --teal:#0E8C7F; --aqua:#22B8A8; --sun:#FFB84D;
  --coral:#FF6F52; --done:#A3B0AB; --ok:#2E9E6B; --warn:#D98A00;
  --s0:#0E8C7F; --s0soft:#E0F3F0; --s1:#E85A4F; --s1soft:#FDEAE7;
  --s2:#3B82C4; --s2soft:#E6F0FA; --s3:#E8862E; --s3soft:#FCEFDF;
  --s4:#9A5FC9; --s4soft:#F3EAFA;
  --hero-ink:#FFFFFF;
  --shadow:0 2px 8px rgba(36,49,46,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121B19; --card:#1B2725; --ink:#EAF1EE; --sub:#93A5A0;
    --line:#2A3835; --teal:#3FC2B2; --aqua:#2FA99B; --sun:#E8A83E;
    --coral:#FF8A70; --done:#5F716C; --ok:#4FBF8A; --warn:#E8A83E;
    --s0:#3FC2B2; --s0soft:#1B3330; --s1:#FF8A70; --s1soft:#3A2523;
    --s2:#6BA8DE; --s2soft:#1F2C3A; --s3:#F0A055; --s3soft:#392C1C;
    --s4:#B98AE0; --s4soft:#2F2439;
    --hero-ink:#FFFFFF;
    --shadow:0 2px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121B19; --card:#1B2725; --ink:#EAF1EE; --sub:#93A5A0;
  --line:#2A3835; --teal:#3FC2B2; --aqua:#2FA99B; --sun:#E8A83E;
  --coral:#FF8A70; --done:#5F716C; --ok:#4FBF8A; --warn:#E8A83E;
  --s0:#3FC2B2; --s0soft:#1B3330; --s1:#FF8A70; --s1soft:#3A2523;
  --s2:#6BA8DE; --s2soft:#1F2C3A; --s3:#F0A055; --s3soft:#392C1C;
  --s4:#B98AE0; --s4soft:#2F2439;
  --hero-ink:#FFFFFF;
  --shadow:0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
  line-height:1.5; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1160px; margin:0 auto; padding:0 16px 80px}

/* ---------- 히어로 ---------- */
.hero{
  margin:14px 0 0; border-radius:20px; padding:22px 22px 20px;
  background:linear-gradient(130deg, var(--teal) 0%, var(--aqua) 52%, var(--sun) 120%);
  color:var(--hero-ink); position:relative; overflow:hidden;
}
.hero::after{
  content:"🌴"; position:absolute; right:14px; bottom:-14px; font-size:88px;
  opacity:.22; transform:rotate(-8deg);
}
.hero .eyebrow{font-size:12px; letter-spacing:.16em; font-weight:800; opacity:.9}
.hero h1{font-size:26px; font-weight:900; letter-spacing:-.02em; margin:4px 0 2px; text-wrap:balance}
.hero .dates{font-size:14px; font-weight:600; opacity:.95}
.live{
  position:absolute; top:16px; right:16px;
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800;
  background:rgba(0,0,0,.18); border-radius:99px; padding:5px 11px; color:#fff;
}
.live .dot{width:8px; height:8px; border-radius:50%; background:var(--sun)}
.live.on .dot{background:#7CFFC2}

/* ---------- 탭 + 진행률 (sticky) ---------- */
.sticky{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:10px 0; border-bottom:1px solid var(--line); margin-bottom:14px;
}
.tabs{display:flex; gap:8px}
.tab{
  flex:1; max-width:220px; border:1.5px solid var(--line); background:var(--card);
  color:var(--sub); border-radius:12px; padding:9px 0; font-size:14px; font-weight:800;
  font-family:inherit; cursor:pointer;
}
.tab.on{background:var(--teal); border-color:var(--teal); color:#fff}
.progress-row{display:flex; align-items:center; gap:10px; margin-top:10px}
.bar{flex:1; height:9px; border-radius:99px; background:var(--line); overflow:hidden}
.bar>i{display:block; height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg, var(--teal), var(--aqua), var(--sun)); transition:width .3s}
.count{font-size:13px; font-weight:800; color:var(--sub);
  font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- 검색 + 전체 추가 ---------- */
.controls{display:flex; flex-direction:column; gap:8px; margin-bottom:16px}
.search-row{position:relative}
.search-row .icon{position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:15px; pointer-events:none}
#searchInput{
  width:100%; border:1.5px solid var(--line); border-radius:12px;
  padding:11px 38px 11px 38px; font-size:15px; font-family:inherit;
  background:var(--card); color:var(--ink);
}
#searchClear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  border:none; background:none; color:var(--sub); font-size:17px; padding:6px 9px;
  cursor:pointer; display:none;
}
.gadd-row{display:flex; gap:8px}
#gaddSection{
  border:1.5px solid var(--line); border-radius:12px; padding:0 8px; font-size:14px;
  font-family:inherit; background:var(--card); color:var(--ink); font-weight:700;
}
#gaddInput{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px;
  padding:10px 12px; font-size:15px; font-family:inherit; background:var(--card); color:var(--ink);
}
.btn{
  border:none; border-radius:12px; padding:10px 16px; font-size:14px;
  font-weight:800; font-family:inherit; cursor:pointer; background:var(--teal); color:#fff;
}
.btn.small{padding:8px 13px; border-radius:10px; flex:none}
.btn.ghost{background:var(--card); color:var(--sub); border:1px solid var(--line)}
.btn.danger{background:var(--coral)}
input::placeholder{color:var(--sub)}
input:focus,select:focus{outline:2px solid var(--teal); outline-offset:-1px}

/* ---------- 섹션 그리드 (웹은 가로 배치) ---------- */
.grid{display:grid; gap:14px; grid-template-columns:1fr; align-items:start}
@media (min-width:720px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1060px){ .grid{grid-template-columns:repeat(3,1fr)} }

section.grp{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden; border-top:4px solid var(--sc);
}
.grp-head{
  display:flex; align-items:center; gap:10px;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.grp-head .emoji{
  width:34px; height:34px; border-radius:10px; background:var(--scsoft);
  display:grid; place-items:center; font-size:17px; flex:none;
}
.grp-head h2{font-size:15px; font-weight:800; letter-spacing:-.01em; flex:1}
.grp-head .gc{font-size:12px; font-weight:800; color:var(--sub); font-variant-numeric:tabular-nums}
.grp-head .gc.full{color:var(--sc)}
.add-row{display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--scsoft)}
.add-row input{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:10px; padding:8px 12px;
  font-size:14px; font-family:inherit; background:var(--card); color:var(--ink);
}
ul.items{list-style:none}
li.item{
  display:flex; align-items:center; gap:8px; padding:9px 10px 9px 16px;
  border-bottom:1px solid var(--line); cursor:pointer; user-select:none;
}
li.item:last-child{border-bottom:none}
li.item:active{background:var(--scsoft)}
li.item.hide{display:none}
.box{
  width:22px; height:22px; flex:none; border-radius:8px;
  border:2px solid var(--line); display:grid; place-items:center;
  transition:all .15s; background:var(--card); margin-right:4px;
}
li.item.on .box{background:var(--sc); border-color:var(--sc)}
.box svg{width:13px; height:13px; stroke:#fff; stroke-width:3; fill:none;
  stroke-linecap:round; stroke-linejoin:round; opacity:0}
li.item.on .box svg{opacity:1}
.txt{font-size:15px; flex:1; min-width:0; word-break:break-word}
li.item.on .txt{color:var(--done); text-decoration:line-through}
.del{
  flex:none; border:none; background:none; color:var(--sub); font-size:18px;
  padding:2px 6px; cursor:pointer; line-height:1; border-radius:6px;
}
.del:active{color:var(--coral)}
.pencil-btn{
  flex:none; border:none; background:none; font-size:13px; padding:6px;
  cursor:pointer; line-height:1; border-radius:6px; opacity:.6; font-family:inherit;
}
.grip{
  flex:none; border:none; background:none; color:var(--sub); font-size:16px;
  padding:6px 7px; cursor:grab; line-height:1; border-radius:6px;
  touch-action:none; font-family:inherit; user-select:none;
}
.grip:active{color:var(--teal)}
li.item.dragging{opacity:.55; box-shadow:0 6px 18px rgba(0,0,0,.18)}
.item-edit{
  display:flex; gap:6px; padding:8px 12px; border-bottom:1px solid var(--line);
  align-items:center; background:var(--scsoft);
}
.item-edit input{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:8px;
  padding:7px 10px; font-size:14px; font-family:inherit; background:var(--card); color:var(--ink);
}
.item-edit .btn.small{padding:7px 11px; font-size:13px; border-radius:8px}
.empty-search{
  grid-column:1/-1; text-align:center; color:var(--sub); font-size:14px; padding:30px 0;
}
.new-section{
  border:2px dashed var(--line); border-radius:16px; padding:14px;
  display:flex; gap:8px; align-items:center; background:none;
}
.new-section input{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:10px;
  padding:9px 12px; font-size:14px; font-family:inherit; background:var(--card); color:var(--ink);
}

/* ---------- 일정: 날짜 칩 ---------- */
.day-chips{
  display:flex; gap:6px; overflow-x:auto; padding:2px 0 12px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.day-chips::-webkit-scrollbar{display:none}
.dchip{
  flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--sub);
  border-radius:13px; padding:7px 13px; font-size:13px; font-weight:800;
  font-family:inherit; cursor:pointer; line-height:1.3; text-align:center;
}
.dchip small{display:block; font-size:10px; font-weight:700; opacity:.8}
.dchip.on{background:var(--dc); border-color:var(--dc); color:#fff}
.dchip.today:not(.on){border-color:var(--coral); color:var(--coral)}

/* ---------- 일정: 카드 + 타임라인 ---------- */
.day{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden; border-top:4px solid var(--dc);
}
.day-head{
  display:flex; align-items:center; gap:8px; padding:12px 12px 12px 16px;
  border-bottom:1px solid var(--line);
}
.day-head .dnum{font-size:12px; font-weight:900; color:var(--dc); letter-spacing:.08em}
.day-head h2{font-size:16px; font-weight:800; flex:1}
.day-head .tag{font-size:12px; font-weight:800; color:var(--dc)}
.day-head .btn.small{background:var(--dc); font-size:13px}
.untimed{
  padding:8px 12px; border-bottom:1px dashed var(--line);
  display:flex; flex-direction:column; gap:6px; background:var(--dcsoft);
}
.untimed .ulabel{font-size:11px; font-weight:800; color:var(--sub)}
.uchip{
  background:var(--card); border:1px solid var(--line); border-radius:9px;
  padding:6px 4px 6px 10px; font-size:13px; font-weight:700;
  display:flex; gap:6px; align-items:center; cursor:pointer;
}
.uchip .ex{flex:1; min-width:0; word-break:break-word}
.uchip.dragging{opacity:.75; box-shadow:0 8px 22px rgba(0,0,0,.25); z-index:80; border-color:var(--dc)}
.uhint{font-size:12px; color:var(--sub)}
.tl{position:relative; user-select:none}
.tl-hour{position:absolute; left:48px; right:0; border-top:1px dashed var(--line); pointer-events:none}
.tl-hour.solid{border-top-style:solid}
.tl-hlabel{
  position:absolute; left:0; width:42px; text-align:right; font-size:10px;
  font-weight:800; color:var(--sub); transform:translateY(-55%);
  font-variant-numeric:tabular-nums; pointer-events:none;
}
.tl-events{position:absolute; left:52px; right:8px; top:0; bottom:0}
.ev{
  position:absolute; background:var(--dcsoft); border-left:4px solid var(--dc);
  border-radius:8px; padding:3px 26px 3px 8px; overflow:hidden; cursor:pointer;
  box-shadow:var(--shadow); min-width:0;
}
.ev .evt{font-size:10px; font-weight:900; color:var(--dc); font-variant-numeric:tabular-nums; line-height:1.4}
.ev .evx{font-size:12.5px; font-weight:700; line-height:1.3; word-break:break-word}
.ev .evl{font-size:10.5px; color:var(--sub); line-height:1.4}
.ev .grip{position:absolute; right:0; top:0; padding:7px 8px; font-size:14px}
.ev.dragging{opacity:.8; box-shadow:0 8px 22px rgba(0,0,0,.3); z-index:10}
.nowline{
  position:absolute; left:44px; right:0; height:0; border-top:2px solid var(--coral);
  pointer-events:none; z-index:6;
}
.nowline::before{
  content:""; position:absolute; left:0; top:-5px; width:8px; height:8px;
  border-radius:50%; background:var(--coral);
}
.tl-tip{padding:10px 14px 14px; font-size:12px; color:var(--sub)}

/* ---------- 일정 편집 시트 ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.overlay.show{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--card);
  border-radius:20px 20px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:82vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.2);
  transform:translateY(110%); transition:transform .22s;
}
.sheet.show{transform:translateY(0)}
@media (min-width:720px){
  .sheet{left:50%; right:auto; width:540px; margin-left:-270px; bottom:28px; border-radius:20px}
  .sheet{transform:translateY(calc(110% + 28px))}
  .sheet.show{transform:translateY(0)}
}
.sheet-head{display:flex; align-items:center; margin-bottom:12px}
.sheet-head h3{font-size:16px; font-weight:900; flex:1}
.sheet-head .del{font-size:22px}
.sheet label{font-size:12px; font-weight:800; color:var(--sub); display:block; margin-bottom:4px}
.sheet .field{margin-bottom:12px}
.sheet .row2{display:flex; gap:10px}
.sheet .row2 .field{flex:1}
.sheet input[type=text]{
  width:100%; border:1.5px solid var(--line); border-radius:11px; padding:10px 12px;
  font-size:15px; font-family:inherit; background:var(--bg); color:var(--ink);
}
.sheet input[type=time]{
  width:100%; border:1.5px solid var(--line); border-radius:11px; padding:9px 10px;
  font-size:15px; font-family:inherit; background:var(--bg); color:var(--ink);
}
.loc-sel{
  display:flex; align-items:center; gap:8px; background:var(--s0soft);
  border-radius:10px; padding:8px 6px 8px 12px; font-size:13px; font-weight:700;
  margin-bottom:8px;
}
.loc-sel span{flex:1; min-width:0; word-break:break-word}
.loc-search{display:flex; gap:8px; margin-bottom:8px}
.loc-search input{flex:1; min-width:0}
.loc-res{display:flex; flex-direction:column; gap:4px; margin-bottom:8px}
.loc-res button{
  text-align:left; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:10px; padding:8px 11px; font-size:13px; font-family:inherit; cursor:pointer;
}
.loc-res button b{display:block; font-size:13px}
.loc-res button i{font-style:normal; font-size:11px; color:var(--sub)}
.preset-wrap{max-height:120px; overflow-y:auto}
.preset-grid{display:flex; flex-wrap:wrap; gap:6px}
.pchip{
  border:1px solid var(--line); border-radius:99px; padding:6px 11px; font-size:12px;
  font-weight:700; background:var(--bg); color:var(--ink); font-family:inherit; cursor:pointer;
}
.pchip:active{background:var(--s0soft)}
.sheet-actions{display:flex; gap:8px; margin-top:14px}
.sheet-actions .btn{flex:1; padding:12px 0; font-size:15px}
.sheet-actions .btn.danger,.sheet-actions .btn.ghost{flex:none; padding:12px 18px}

/* ---------- 지도 ---------- */
#map{
  height:calc(100dvh - 250px); min-height:420px; border-radius:16px;
  border:1px solid var(--line); z-index:1;
}
.map-chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none}
.map-chips::-webkit-scrollbar{display:none}
.mchip{
  flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--sub);
  border-radius:99px; padding:7px 14px; font-size:13px; font-weight:800;
  font-family:inherit; cursor:pointer;
}
.mchip.on{color:#fff; border-color:transparent}
.mk{
  width:26px; height:26px; border-radius:50%; border:2.5px solid #fff; color:#fff;
  font-size:12px; font-weight:900; display:grid; place-items:center;
  box-shadow:0 1px 5px rgba(0,0,0,.45); font-family:inherit;
}
.leaflet-popup-content{font-family:inherit; font-size:13px; line-height:1.5; margin:10px 14px}

/* ---------- 기타 ---------- */
.note{
  background:var(--card); border:1px dashed var(--line); border-radius:14px;
  padding:12px 14px; margin-top:18px; font-size:13px; color:var(--sub);
}
.note b{color:var(--ink)}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px);
  background:var(--ink); color:var(--bg); font-size:14px; font-weight:600;
  padding:11px 18px; border-radius:99px; transition:transform .25s; z-index:70;
  max-width:90vw; text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{margin-top:24px; text-align:center}
.foot button{background:none; border:none; color:var(--sub); font-size:12px;
  font-family:inherit; cursor:pointer; text-decoration:underline; padding:8px}
.hidden{display:none !important}
li.item:focus-visible,.tab:focus-visible,.btn:focus-visible,.foot button:focus-visible{
  outline:2px solid var(--coral); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">NHA TRANG · 가족여행</div>
    <h1>나트랑 여행 🌊</h1>
    <div class="dates">9/10 (목) 출발 ✈️ → 9/14 (월) 귀국 🛬 · 4박 5일</div>
    <div class="live" id="live"><span class="dot"></span><span id="liveTxt">연결 중…</span></div>
  </div>

  <div class="sticky">
    <div class="tabs">
      <button class="tab on" id="tabCheck">🧳 준비물</button>
      <button class="tab" id="tabPlan">🗓️ 일정</button>
      <button class="tab" id="tabMap">🗺️ 지도</button>
    </div>
    <div class="progress-row" id="progressRow">
      <div class="bar"><i id="barFill"></i></div>
      <span class="count" id="totalCount">0 / 0</span>
    </div>
  </div>

  <!-- ===== 준비물 탭 ===== -->
  <div id="viewCheck">
    <div class="controls">
      <div class="search-row">
        <span class="icon">🔍</span>
        <input id="searchInput" placeholder="전체 검색 — 예: 기저귀, 선크림" autocomplete="off">
        <button id="searchClear" aria-label="검색 지우기">×</button>
      </div>
      <div class="gadd-row">
        <select id="gaddSection" aria-label="추가할 항목 선택"></select>
        <input id="gaddInput" placeholder="새 준비물 추가" autocomplete="off">

const PRESETS = [

const CACHE_KEY = "nhatrang-rt-cache-v2";
let state = {chk:{}, custom:{}, plan:{}, removed:{}, sections:{}, ord:{}, edits:{}};
let query = "";

function normalize(s){
  state = {chk:(s&&s.chk)||{}, custom:(s&&s.custom)||{}, plan:(s&&s.plan)||{},
    removed:(s&&s.removed)||{}, sections:(s&&s.sections)||{}, ord:(s&&s.ord)||{},
    edits:(s&&s.edits)||{}};
}
try{ normalize(JSON.parse(localStorage.getItem(CACHE_KEY))); }catch(e){}

/* ---------- 서버 통신 (Firebase RTDB REST + SSE) ---------- */
function dbWrite(path, value){
  return fetch(DB + path + ".json", {
    method: value === null ? "DELETE" : "PUT",
    body: value === null ? undefined : JSON.stringify(value)
  }).then(r => { if(!r.ok) throw new Error("HTTP "+r.status); })
    .catch(() => toast("저장 실패 — 인터넷 연결을 확인해 주세요"));
}
function applyPut(path, data){
  const segs = path.split("/").filter(Boolean);
  if(segs.length === 0){ normalize(data); return; }
  let node = state;
  for(let i=0; i<segs.length-1; i++){
    if(typeof node[segs[i]] !== "object" || node[segs[i]] === null) node[segs[i]] = {};
    node = node[segs[i]];
  }
  const last = segs[segs.length-1];
  if(data === null) delete node[last]; else node[last] = data;
  normalize(state);
}
const liveEl = document.getElementById("live");
function setLive(on, txt){
  liveEl.classList.toggle("on", on);
  document.getElementById("liveTxt").textContent = txt;
}
function connect(){
  const es = new EventSource(DB + ".json");
  es.addEventListener("put", e => {
    const d = JSON.parse(e.data);
    applyPut(d.path, d.data);
    setLive(true, "실시간 연결됨");
    saveCache(); renderAll();
  });
  es.addEventListener("patch", e => {
    const d = JSON.parse(e.data);
    const base = d.path.split("/").filter(Boolean);
    Object.keys(d.data||{}).forEach(k => applyPut("/"+base.concat(k).join("/"), d.data[k]));
    saveCache(); renderAll();
  });
  es.onerror = () => setLive(false, "재연결 중…");
}
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){} }
function localThenRemote(path, value){
  applyPut(path, value); saveCache(); renderAll(); dbWrite(path, value);
}
function newKey(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------- 드래그 공통 (⠿ 손잡이를 잡고 끌기 - 터치/마우스 공용) ---------- */
let dragActive = false, pendingRender = false, justDragged = false;
// 드래그 직후 남은 click 이 토글/수정으로 새지 않게 캡처 단계에서 차단
document.addEventListener("click", e=>{
  if(justDragged){ e.stopPropagation(); e.preventDefault(); }
}, true);
let scrollDir = 0, scrollRaf = null;
function dragScroll(y){
  const m = 70;
  scrollDir = y < m ? -1 : (y > window.innerHeight - m ? 1 : 0);
  if(scrollDir && !scrollRaf) scrollRaf = requestAnimationFrame(dragScrollLoop);
}
function dragScrollLoop(){
  if(!scrollDir || !dragActive){ scrollRaf = null; return; }
  window.scrollBy(0, scrollDir * 8);
  scrollRaf = requestAnimationFrame(dragScrollLoop);
}
// handle 을 누른 채 6px 이상 움직이면 드래그 시작. 포인터 캡처라 손가락이 어디로 가도 따라옴.
function bindDrag(handle, cb){
  handle.addEventListener("pointerdown", e=>{
    if(dragActive) return;
    e.preventDefault(); e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    let moved = false, done = false;
    try{ handle.setPointerCapture(pid); }catch(err){}
    const onMove = ev=>{
      if(ev.pointerId !== pid) return;
      if(!moved && Math.abs(ev.clientX-sx) + Math.abs(ev.clientY-sy) > 6){
        moved = true; dragActive = true; if(cb.start) cb.start();
      }
      if(!moved) return;
      ev.preventDefault();
      if(cb.autoScroll !== false) dragScroll(ev.clientY);
      cb.move(ev.clientX, ev.clientY, ev.clientX-sx, ev.clientY-sy);
    };
    const onEnd = ev=>{
      if(ev.pointerId !== pid || done) return;
      done = true;
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onEnd);
      handle.removeEventListener("pointercancel", onEnd);
      scrollDir = 0;
      if(!moved) return;
      dragActive = false;
      justDragged = true; setTimeout(()=>{ justDragged = false; }, 250);
      cb.end(ev.type === "pointerup", ev.clientX, ev.clientY);
      if(pendingRender){ pendingRender = false; renderAll(); }
    };
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onEnd);
    handle.addEventListener("pointercancel", onEnd);
  });
  handle.addEventListener("click", e=>{ e.stopPropagation(); });
}

/* ---------- 준비물 렌더링 ---------- */
const secEl = document.getElementById("sections");
function matches(t){ return !query || t.toLowerCase().includes(query); }
let ckEd = null; // 준비물 인라인 수정 상태 {id, draft, custom, focusPending}
// 기본 5개 + 직접 추가한 대분류를 합쳐 한 목록으로
function sectionList(){
  const base = DATA.map((sec,si)=>({id:si, name:sec.name, emoji:sec.emoji, color:si, items:sec.items, custom:false}));
  const cust = Object.entries(state.sections).filter(([k,v])=>v)
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,v],i)=>({id:k, name:v.n, emoji:v.e||"📦", color:(5+i)%5, items:[], custom:true}));
  return base.concat(cust);
}
function renderCheck(){
  secEl.innerHTML = "";
  let anyVisible = false;
  sectionList().forEach(sec=>{
    const customs = Object.entries(state.custom).filter(([k,c])=>c && c.s===sec.id);
    const baseItems = sec.custom ? [] :
      sec.items.map((t,ii)=>[t,ii]).filter(([t,ii])=>!state.removed[sec.id+"-"+ii]);
    const total = baseItems.length + customs.length;
    let done = 0, visibleCount = 0;

    const box = document.createElement("section");
    box.className = "grp";
    box.style.setProperty("--sc", "var(--s"+sec.color+")");
    box.style.setProperty("--scsoft", "var(--s"+sec.color+"soft)");

    const head = document.createElement("div");
    head.className = "grp-head";
    const ul = document.createElement("ul");
    ul.className = "items";

    // 기본 + 직접 추가 항목을 한 목록으로 합쳐 저장된 순서(ord)대로 정렬
    const sKey = "s"+sec.id, sord = state.ord[sKey]||{};
    const rows = [];
    baseItems.forEach(([t, ii])=>{
      const id = sec.id+"-"+ii;
      rows.push({id:id, text:state.edits[id]||t, orig:t, base:true});
    });
    customs.forEach(([key, c])=> rows.push({id:key, text:String(c.t), c:c}));
    rows.forEach((r, i)=>{ r.def = i; });
    rows.sort((a, b)=>{
      const oa = typeof sord[a.id]==="number" ? sord[a.id] : 10000+a.def;
      const ob = typeof sord[b.id]==="number" ? sord[b.id] : 10000+b.def;
      return oa-ob;
    });
    rows.forEach(r=>{
      const on = r.base ? !!state.chk[r.id] : !!r.c.c;
      if(on) done++;

      // 인라인 수정 모드
      if(ckEd && ckEd.id === r.id){
        const li = document.createElement("li");
        li.className = "item-edit";
        const inp = document.createElement("input");
        inp.value = ckEd.draft;
        inp.addEventListener("input", ()=>{ ckEd.draft = inp.value; });
        const doSave = ()=>{
          const t = ckEd.draft.trim();
          if(!t) return;
          const ed = ckEd; ckEd = null;
          if(r.base) localThenRemote("/edits/"+r.id, t===r.orig ? null : t);
          else localThenRemote("/custom/"+r.id+"/t", t);
        };
        const sv = document.createElement("button");
        sv.className = "btn small"; sv.textContent = "저장";
        sv.style.background = "var(--sc)";
        sv.addEventListener("click", doSave);
        inp.addEventListener("keydown", e=>{ if(e.key==="Enter") doSave(); });
        const cc = document.createElement("button");
        cc.className = "btn small ghost"; cc.textContent = "취소";
        cc.addEventListener("click", ()=>{ ckEd = null; renderCheck(); });
        li.appendChild(inp); li.appendChild(sv); li.appendChild(cc);
        if(ckEd.focusPending){ ckEd.focusPending = false; setTimeout(()=>inp.focus(), 0); }
        ul.appendChild(li);
        visibleCount++;
        return;
      }

      const li = makeItem(r.text, on,
        r.base ? ()=> localThenRemote("/chk/"+r.id, state.chk[r.id]?null:true)
               : ()=> localThenRemote("/custom/"+r.id+"/c", r.c.c?null:true),
        r.base ? ()=> localThenRemote("/removed/"+r.id, true)
               : ()=> localThenRemote("/custom/"+r.id, null),
        ()=>{ ckEd = {id:r.id, draft:r.text, focusPending:true}; renderCheck(); },
        !query);
      li.dataset.id = r.id;
      const grip = li.querySelector(".grip");
      if(grip) bindDrag(grip, {
        start(){ li.classList.add("dragging"); },
        move(x, y){
          const t = document.elementFromPoint(x, y);
          const over = t && t.closest ? t.closest("li.item") : null;
          if(!over || over === li || over.parentElement !== ul) return;
          const rc = over.getBoundingClientRect();
          ul.insertBefore(li, y < rc.top + rc.height/2 ? over : over.nextSibling);
        },
        end(commit){
          li.classList.remove("dragging");
          if(!commit){ renderCheck(); return; }
          const ordObj = {};
          ul.querySelectorAll("li.item").forEach((el, i)=>{ ordObj[el.dataset.id] = i; });
          localThenRemote("/ord/"+sKey, ordObj);
        }
      });
      if(!matches(r.text)) li.classList.add("hide"); else visibleCount++;
      ul.appendChild(li);
    });

    head.innerHTML = "<span class='emoji'>"+sec.emoji+"</span><h2>"+esc(sec.name)+"</h2>"
      + "<span class='gc"+(done===total&&total>0?" full":"")+"'>"+done+" / "+total+"</span>";
    if(sec.custom){
      // 직접 만든 대분류는 삭제 가능 (항목이 있으면 두 번 눌러 확정)
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "×";
      del.setAttribute("aria-label", sec.name+" 대분류 삭제");
      let armed = false, timer;
      del.addEventListener("click", ()=>{
        if(customs.length > 0 && !armed){
          armed = true; del.textContent = "확인";
          toast("항목 "+customs.length+"개가 같이 지워져요 — [확인]을 한 번 더 누르면 삭제");
          timer = setTimeout(()=>{ armed=false; del.textContent="×"; }, 4000);
          return;
        }
        clearTimeout(timer);
        customs.forEach(([key])=>{ applyPut("/custom/"+key, null); dbWrite("/custom/"+key, null); });
        applyPut("/ord/"+sKey, null); dbWrite("/ord/"+sKey, null);
        localThenRemote("/sections/"+sec.id, null);
      });
      head.appendChild(del);
    }
    box.appendChild(head);

    // 항목 추가 - 섹션 상단 (버튼 + 엔터 둘 다)
    const add = document.createElement("div");
    add.className = "add-row";
    const inp = document.createElement("input");
    inp.placeholder = "+ "+sec.name+" 항목 추가";
    const addBtn = document.createElement("button");
    addBtn.className = "btn small"; addBtn.textContent = "추가";
    addBtn.style.background = "var(--sc)";
    const submitSec = ()=>{
      if(!inp.value.trim()) return;
      localThenRemote("/custom/"+newKey(), {s:sec.id, t:inp.value.trim(), c:false});
    };
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") submitSec(); });
    addBtn.addEventListener("click", submitSec);
    add.appendChild(inp); add.appendChild(addBtn);
    box.appendChild(add);
    box.appendChild(ul);

    if(query && visibleCount===0) box.classList.add("hidden");
    else anyVisible = true;
    secEl.appendChild(box);
  });

  // 새 대분류 추가 카드
  const nsCard = document.createElement("div");
  nsCard.className = "new-section";
  const nsInp = document.createElement("input");
  nsInp.placeholder = "+ 새 대분류 이름 (예: 엄마아빠 옷)";
  const nsBtn = document.createElement("button");
  nsBtn.className = "btn small"; nsBtn.textContent = "대분류 추가";
  const nsSubmit = ()=>{
    const n = nsInp.value.trim();
    if(!n) return;
    localThenRemote("/sections/"+newKey(), {n:n});
    toast("\""+n+"\" 대분류를 만들었어요");
  };
  nsInp.addEventListener("keydown", e=>{ if(e.key==="Enter") nsSubmit(); });
  nsBtn.addEventListener("click", nsSubmit);
  nsCard.appendChild(nsInp); nsCard.appendChild(nsBtn);
  if(!query) secEl.appendChild(nsCard);

  if(query && !anyVisible){
    const em = document.createElement("div");
    em.className = "empty-search";
    em.textContent = "\""+query+"\" 검색 결과가 없어요";
    secEl.appendChild(em);
  }
  rebuildGaddOptions();
  updateTotal();
}
function makeItem(text, on, onToggle, onDel, onEdit, movable){
  const li = document.createElement("li");
  li.className = "item"+(on?" on":"");
  li.tabIndex = 0;
  li.setAttribute("role","checkbox");
  li.setAttribute("aria-checked", on);
  li.setAttribute("aria-label", text);
  li.innerHTML = "<span class='box'><svg viewBox='0 0 16 16'><polyline points='2.5,8.5 6.5,12.5 13.5,4'/></svg></span><span class='txt'>"+esc(text)+"</span>";
  if(onEdit){
    const p = document.createElement("button");
    p.className = "pencil-btn"; p.textContent = "✏️"; p.setAttribute("aria-label","수정");
    p.addEventListener("click", e=>{ e.stopPropagation(); onEdit(); });
    li.appendChild(p);
  }
  if(movable){
    const g = document.createElement("button");
    g.className = "grip"; g.textContent = "⠿"; g.setAttribute("aria-label","끌어서 순서 이동");
    li.appendChild(g);
  }
  if(onDel){
    const d = document.createElement("button");
    d.className = "del"; d.textContent = "×"; d.setAttribute("aria-label","삭제");
    d.addEventListener("click", e=>{ e.stopPropagation(); onDel(); });
    li.appendChild(d);
  }
  li.addEventListener("click", onToggle);
  li.addEventListener("keydown", e=>{ if(e.target!==li) return; if(e.key===" "||e.key==="Enter"){ e.preventDefault(); onToggle(); }});
  return li;
}
function updateTotal(){
  let total=0, done=0;
  DATA.forEach((sec,si)=>{
    sec.items.forEach((_,ii)=>{
      if(state.removed[si+"-"+ii]) return;
      total++;
      if(state.chk[si+"-"+ii]) done++;
    });
  });
  Object.values(state.custom).forEach(c=>{ if(!c) return; total++; if(c.c) done++; });
  document.getElementById("totalCount").textContent = done+" / "+total;
  document.getElementById("barFill").style.width = total?Math.round(done/total*100)+"%":"0%";
}

/* ---------- 일정: 타임라인 캘린더 ---------- */
const planEl = document.getElementById("planGrid");
const dayChipsEl = document.getElementById("dayChips");
const HOUR_PX = 44, TL_TOP = 10, TL_BOTTOM = 10;
const PXPM = HOUR_PX / 60; // px per minute
function todayDi(){
  const n = new Date();
  const d = Math.floor((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - TRIP_START) / 86400000);
  return (d >= 0 && d < DAYS.length) ? d : -1;
}
let planDay = (function(){
  const s = parseInt(localStorage.getItem("nt-planday"), 10);
  if(!isNaN(s) && s >= 0 && s < DAYS.length) return s;
  const t = todayDi();
  return t >= 0 ? t : 0;
})();
function minsOf(t){ return parseInt(t.slice(0,2),10)*60 + (parseInt(t.slice(3,5),10)||0); }
function fmtMin(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function dayEntries(di){
  const all = Object.entries((state.plan||{})["d"+di]||{}).filter(([k,v])=>v && v.x);
  const untimed = all.filter(([k,en])=>!en.t)
    .sort((a,b)=> (a[1].o||0)-(b[1].o||0) || a[0].localeCompare(b[0]));
  const timed = all.filter(([k,en])=>en.t)
    .sort((a,b)=> minsOf(a[1].t)-minsOf(b[1].t) || a[0].localeCompare(b[0]));
  return {untimed, timed};
}
// 저장 값 구성: 시간·내용 + (있으면) 종료·장소를 함께
function entryValue(en, over){
  const v = {t:(over.t!==undefined?over.t:en.t)||"", x:over.x!==undefined?over.x:en.x};
  const e = over.e!==undefined ? over.e : en.e;
  if(e && v.t && minsOf(e) > minsOf(v.t)) v.e = e;
  const la = over.la!==undefined ? over.la : en.la;
  const lo = over.lo!==undefined ? over.lo : en.lo;
  if(typeof la === "number" && typeof lo === "number"){
    v.la = la; v.lo = lo;
    const ln = over.ln!==undefined ? over.ln : en.ln;
    if(ln) v.ln = ln;
  }
  return v;
}
function renderPlan(){
  // 날짜 칩
  dayChipsEl.innerHTML = "";
  const tdi = todayDi();
  DAYS.forEach((day, di)=>{
    const b = document.createElement("button");
    b.className = "dchip" + (di===planDay?" on":"") + (di===tdi?" today":"");
    b.style.setProperty("--dc", "var(--"+DAYCOLOR[di]+")");
    b.innerHTML = "DAY "+(di+1)+"<small>"+day.label+(di===tdi?" · 오늘":"")+"</small>";
    b.addEventListener("click", ()=>{
      planDay = di;
      try{ localStorage.setItem("nt-planday", String(di)); }catch(e){}
      renderPlan();
    });
    dayChipsEl.appendChild(b);
  });

  planEl.innerHTML = "";
  const di = planDay, day = DAYS[di];
  const card = document.createElement("div");
  card.className = "day";
  card.style.setProperty("--dc", "var(--"+DAYCOLOR[di]+")");
  card.style.setProperty("--dcsoft", "var(--"+DAYCOLOR[di]+"soft)");

  const head = document.createElement("div");
  head.className = "day-head";
  head.innerHTML = "<span class='dnum'>DAY "+(di+1)+"</span><h2>"+day.label+"</h2>"
    + (day.tag ? "<span class='tag'>"+day.tag+"</span>" : "");
  const addBtn = document.createElement("button");
  addBtn.className = "btn small"; addBtn.textContent = "+ 일정";
  addBtn.addEventListener("click", ()=> openSheet({mode:"add", di:di}));
  head.appendChild(addBtn);
  card.appendChild(head);

  const ds = dayEntries(di);

  // 시간 미정 구역
  const uz = document.createElement("div");
  uz.className = "untimed"; uz.id = "untimedZone";
  const ul = document.createElement("div");
  ul.className = "ulabel"; ul.textContent = "⏳ 시간 미정";
  uz.appendChild(ul);
  if(!ds.untimed.length){
    const h = document.createElement("div");
    h.className = "uhint"; h.textContent = "시간을 비우고 저장하면 여기 담겨요. ⠿ 를 잡아 아래 시간표로 끌면 시간이 정해져요.";
    uz.appendChild(h);
  }
  card.appendChild(uz);

  // 타임라인
  const tl = document.createElement("div");
  tl.className = "tl";
  tl.style.height = (24*HOUR_PX + TL_TOP + TL_BOTTOM) + "px";
  for(let h=0; h<=24; h++){
    const line = document.createElement("div");
    line.className = "tl-hour" + (h%6===0 ? " solid" : "");
    line.style.top = (TL_TOP + h*HOUR_PX) + "px";
    tl.appendChild(line);
    if(h < 24){
      const lb = document.createElement("div");
      lb.className = "tl-hlabel";
      lb.style.top = (TL_TOP + h*HOUR_PX) + "px";
      lb.textContent = String(h).padStart(2,"0")+":00";
      tl.appendChild(lb);
    }
  }
  const evLayer = document.createElement("div");
  evLayer.className = "tl-events";
  tl.appendChild(evLayer);

  // 오늘이면 현재 시각 빨간 줄
  if(di === tdi){
    const n = new Date();
    const nowMin = n.getHours()*60 + n.getMinutes();
    const nl = document.createElement("div");
    nl.className = "nowline";
    nl.style.top = (TL_TOP + nowMin*PXPM) + "px";
    tl.appendChild(nl);
  }

  // 겹치는 일정은 열을 나눠 나란히
  const evs = ds.timed.map(([k, en])=>{
    const s = minsOf(en.t);
    let e = (en.e && minsOf(en.e) > s) ? minsOf(en.e) : s + 45;
    e = Math.min(e, 1440);
    return {k, en, s, e};
  });
  let cluster = null;
  const clusters = [];
  evs.forEach(v=>{
    if(!cluster || v.s >= cluster.maxE){ cluster = {items:[], maxE:v.e}; clusters.push(cluster); }
    cluster.items.push(v);
    cluster.maxE = Math.max(cluster.maxE, v.e);
  });
  clusters.forEach(c=>{
    const lanes = [];
    c.items.forEach(v=>{
      let li = lanes.findIndex(endM => endM <= v.s);
      if(li < 0){ lanes.push(v.e); li = lanes.length-1; } else lanes[li] = Math.max(lanes[li], v.e);
      v.lane = li;
    });
    c.items.forEach(v=>{ v.laneN = lanes.length; });
  });

  evs.forEach(v=>{
    const el = document.createElement("div");
    el.className = "ev";
    el.style.top = (TL_TOP + v.s*PXPM) + "px";
    el.style.height = Math.max(30, (v.e - v.s)*PXPM - 3) + "px";
    el.style.left = (100/v.laneN*v.lane) + "%";
    el.style.width = "calc("+(100/v.laneN)+"% - 4px)";
    el.innerHTML = "<div class='evt'>"+v.en.t+(v.en.e?"–"+v.en.e:"")+"</div>"
      + "<div class='evx'>"+esc(v.en.x)+"</div>"
      + (v.en.ln ? "<div class='evl'>📍 "+esc(v.en.ln)+"</div>" : "");
    const g = document.createElement("button");
    g.className = "grip"; g.textContent = "⠿"; g.setAttribute("aria-label","끌어서 시간 이동");
    el.appendChild(g);
    el.addEventListener("click", e=>{
      e.stopPropagation();
      openSheet({mode:"edit", di:di, key:v.k});
    });
    // ⠿ 를 잡고 위아래로 끌면 시간이 그대로 옮겨짐 (10분 단위, 미정 구역에 놓으면 시간 해제)
    let origTop = 0;
    bindDrag(g, {
      start(){ el.classList.add("dragging"); origTop = parseFloat(el.style.top); },
      move(x, y, dx, dy){
        const maxTop = TL_TOP + 1440*PXPM - parseFloat(el.style.height);
        el.style.top = Math.max(TL_TOP - 30, Math.min(maxTop, origTop + dy)) + "px";
      },
      end(commit, x, y){
        el.classList.remove("dragging");
        if(!commit){ renderPlan(); return; }
        const uzEl = document.getElementById("untimedZone");
        const overUz = uzEl && (function(){ const r = uzEl.getBoundingClientRect(); return y >= r.top && y <= r.bottom; })();
        if(overUz){
          localThenRemote("/plan/d"+di+"/"+v.k, entryValue(v.en, {t:"", e:""}));
          toast("시간 미정으로 옮겼어요");
          return;
        }
        const top = Math.max(TL_TOP, parseFloat(el.style.top));
        let ns = Math.round(((top - TL_TOP) / PXPM) / 10) * 10;
        ns = Math.max(0, Math.min(1439, ns));
        const dur = v.en.e ? (minsOf(v.en.e) - v.s) : 0;
        const over = {t: fmtMin(ns)};
        if(dur > 0) over.e = fmtMin(Math.min(1439, ns + dur));
        localThenRemote("/plan/d"+di+"/"+v.k, entryValue(v.en, over));
      }
    });
    evLayer.appendChild(el);
  });

  // 빈 시간을 탭하면 그 시간으로 바로 추가
  tl.addEventListener("click", e=>{
    if(e.target.closest(".ev")) return;
    const rect = tl.getBoundingClientRect();
    let m = Math.round(((e.clientY - rect.top - TL_TOP) / PXPM) / 30) * 30;
    m = Math.max(0, Math.min(1410, m));
    openSheet({mode:"add", di:di, t:fmtMin(m)});
  });

  // 미정 칩 (탭=수정, ⠿ 드래그=타임라인에 놓아 시간 지정)
  ds.untimed.forEach(([k, en])=>{
    const chip = document.createElement("div");
    chip.className = "uchip";
    chip.innerHTML = "<span class='ex'>"+esc(en.x)+(en.ln?" <span style='color:var(--sub);font-size:11px'>📍"+esc(en.ln)+"</span>":"")+"</span>";
    const g = document.createElement("button");
    g.className = "grip"; g.textContent = "⠿"; g.setAttribute("aria-label","끌어서 시간 지정");
    chip.appendChild(g);
    chip.addEventListener("click", e=>{
      e.stopPropagation();
      openSheet({mode:"edit", di:di, key:k});
    });
    let rc = null;
    bindDrag(g, {
      start(){
        rc = chip.getBoundingClientRect();
        chip.classList.add("dragging");
        chip.style.position = "fixed"; chip.style.zIndex = "80";
        chip.style.left = rc.left+"px"; chip.style.top = rc.top+"px"; chip.style.width = rc.width+"px";
      },
      move(x, y, dx, dy){
        chip.style.left = (rc.left + dx) + "px";
        chip.style.top = (rc.top + dy) + "px";
      },
      end(commit, x, y){
        const tlRect = tl.getBoundingClientRect();
        if(commit && y >= tlRect.top && y <= tlRect.bottom){
          let m = Math.round(((y - tlRect.top - TL_TOP) / PXPM) / 10) * 10;
          m = Math.max(0, Math.min(1439, m));
          localThenRemote("/plan/d"+di+"/"+k, entryValue(en, {t:fmtMin(m)}));
          toast(fmtMin(m)+" 으로 옮겼어요");
        }else{
          renderPlan();
        }
      }
    });
    uz.appendChild(chip);
  });

  card.appendChild(tl);
  const tip = document.createElement("div");
  tip.className = "tl-tip";
  tip.textContent = "빈 시간을 탭하면 그 시간에 추가 · 일정을 탭하면 수정 · ⠿ 를 잡고 끌면 시간 이동";
  card.appendChild(tip);
  planEl.appendChild(card);
}

function openSheet(ctx){
  sheetCtx = {mode:ctx.mode, di:ctx.di, key:ctx.key||null, la:null, lo:null, ln:null};
  let en = null;
  if(ctx.mode === "edit" && ctx.key) en = ((state.plan||{})["d"+ctx.di]||{})[ctx.key];

    (ctx.mode === "edit" ? "일정 수정" : "일정 추가") + " — DAY " + (ctx.di+1) + " " + DAYS[ctx.di].label;
  shX.value = en ? en.x : "";
  shT.value = en ? (en.t||"") : (ctx.t||"");

        shLocRes.appendChild(b);
      });
    })
    .catch(()=>{ shLocRes.innerHTML = "<button disabled>검색 실패 — 인터넷 연결을 확인해 주세요</button>"; });

/* ---------- 지도 (Leaflet + OpenStreetMap) ---------- */
let map = null, mapLayer = null, mapDay = -1;
const mapChipsEl = document.getElementById("mapChips");
function ensureMap(){
  if(map) return true;
  if(typeof L === "undefined"){
    toast("지도를 불러오는 중이에요 — 잠시 후 다시 눌러 주세요");
    return false;
  }
  map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  mapLayer = L.layerGroup().addTo(map);
  map.setView([12.2431, 109.1899], 13);
  return true;
}
function renderMapChips(){
  mapChipsEl.innerHTML = "";
  const mk = (label, di)=>{
    const b = document.createElement("button");
    b.className = "mchip" + (mapDay===di?" on":"");
    if(mapDay === di) b.style.background = di < 0 ? "var(--teal)" : DAYHEX[di];
    b.textContent = label;
    b.addEventListener("click", ()=>{ mapDay = di; renderMapChips(); renderMap(); });
    mapChipsEl.appendChild(b);
  };
  mk("전체", -1);
  DAYS.forEach((day, di)=> mk("DAY "+(di+1)+" · "+day.label.split(" ")[0], di));
}
function renderMap(){
  if(!map) return;
  mapLayer.clearLayers();
  const bounds = [];
  DAYS.forEach((day, di)=>{
    if(mapDay >= 0 && mapDay !== di) return;
    const ds = dayEntries(di);
    const located = ds.timed.concat(ds.untimed)
      .filter(([k, en])=> typeof en.la === "number" && typeof en.lo === "number");
    const pts = [];
    located.forEach(([k, en], i)=>{
      const m = L.marker([en.la, en.lo], {icon: L.divIcon({
        className:"", iconSize:[26,26], iconAnchor:[13,13],
        html:"<div class='mk' style='background:"+DAYHEX[di]+"'>"+(i+1)+"</div>"
      })}).addTo(mapLayer);
      m.bindPopup("<b style='color:"+DAYHEX[di]+"'>DAY "+(di+1)+"</b> "
        + (en.t ? en.t + (en.e?"–"+en.e:"") : "시간 미정") + "<br><b>"+esc(en.x)+"</b>"
        + (en.ln ? "<br>📍 "+esc(en.ln) : ""));
      pts.push([en.la, en.lo]);
      bounds.push([en.la, en.lo]);
    });
    if(pts.length > 1)
      L.polyline(pts, {color:DAYHEX[di], weight:3, opacity:.75, dashArray:"7 7"}).addTo(mapLayer);
  });
  if(bounds.length) map.fitBounds(bounds, {padding:[45,45], maxZoom:15});
  else map.setView([12.2431, 109.1899], 13);
  document.getElementById("mapHint").style.display = bounds.length ? "none" : "";
}

const gaddSection = document.getElementById("gaddSection");
function rebuildGaddOptions(){
  const prev = gaddSection.value;
  gaddSection.innerHTML = "";
  sectionList().forEach(sec=>{
    const o = document.createElement("option");
    o.value = String(sec.id); o.textContent = sec.emoji+" "+sec.name;
    gaddSection.appendChild(o);
  });
  if([...gaddSection.options].some(o=>o.value===prev)) gaddSection.value = prev;
}
const gaddInput = document.getElementById("gaddInput");
function gadd(){
  if(!gaddInput.value.trim()) return;
  const v = gaddSection.value;
  const s = /^\d+$/.test(v) ? +v : v; // 기본 대분류는 번호, 직접 만든 대분류는 키
  localThenRemote("/custom/"+newKey(), {s:s, t:gaddInput.value.trim(), c:false});
  gaddInput.value = "";
  toast("추가했어요");
}
document.getElementById("gaddBtn").addEventListener("click", gadd);
gaddInput.addEventListener("keydown", e=>{ if(e.key==="Enter") gadd(); });

/* ---------- 탭 ---------- */
const tabCheck = document.getElementById("tabCheck"),
      tabPlan = document.getElementById("tabPlan"),
      tabMap = document.getElementById("tabMap");
function showTab(which){
  tabCheck.classList.toggle("on", which==="check");
  tabPlan.classList.toggle("on", which==="plan");
  tabMap.classList.toggle("on", which==="map");
  document.getElementById("viewCheck").classList.toggle("hidden", which!=="check");
  document.getElementById("viewPlan").classList.toggle("hidden", which!=="plan");
  document.getElementById("viewMap").classList.toggle("hidden", which!=="map");
  document.getElementById("progressRow").classList.toggle("hidden", which!=="check");
  history.replaceState(null,"", which==="check" ? location.pathname : "#"+which);
  if(which === "map" && ensureMap()){
    renderMapChips();
    setTimeout(()=>{ map.invalidateSize(); renderMap(); }, 60);
  }
}
tabCheck.addEventListener("click", ()=>showTab("check"));
tabPlan.addEventListener("click", ()=>showTab("plan"));
tabMap.addEventListener("click", ()=>showTab("map"));
if(location.hash==="#plan") showTab("plan");
else if(location.hash==="#map") setTimeout(()=>showTab("map"), 300);

/* ---------- 기타 ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}
// 준비물 전체 초기화 (두 번 눌러 확정, 일정은 유지)
let resetArmed = false, resetTimer;
document.getElementById("resetAll").addEventListener("click", function(){
  if(!resetArmed){
    resetArmed = true; this.textContent = "정말 초기화할까요? 두 사람 모두 지워져요 — 한 번 더";
    resetTimer = setTimeout(()=>{ resetArmed=false; this.textContent="준비물 전체 초기화"; }, 4000);
  }else{
    clearTimeout(resetTimer); resetArmed = false;
    state.chk = {}; state.custom = {}; state.removed = {}; state.sections = {}; state.ord = {}; state.edits = {};
    saveCache(); renderAll();
    dbWrite("/chk", null); dbWrite("/custom", null); dbWrite("/removed", null);
    dbWrite("/sections", null); dbWrite("/ord", null); dbWrite("/edits", null);
    this.textContent = "준비물 전체 초기화"; toast("초기화했어요 (기본 목록으로 복구)");
  }
});

renderAll();
connect();
</script>
