<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>나트랑 여행 준비물 · 일정</title>
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#24312E; --sub:#6E7F7A;
  --line:#E9E9E9; --teal:#0E8C7F; --aqua:#22B8A8; --sun:#FFB84D;
  --coral:#FF6F52; --done:#A3B0AB; --ok:#2E9E6B; --warn:#D98A00;
  --s0:#0E8C7F; --s0soft:#E0F3F0; --s1:#E85A4F; --s1soft:#FDEAE7;
  --s2:#3B82C4; --s2soft:#E6F0FA; --s3:#E8862E; --s3soft:#FCEFDF;
  --s4:#9A5FC9; --s4soft:#F3EAFA;
  --hero-ink:#FFFFFF;
  --shadow:0 2px 8px rgba(36,49,46,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121B19; --card:#1B2725; --ink:#EAF1EE; --sub:#93A5A0;
    --line:#2A3835; --teal:#3FC2B2; --aqua:#2FA99B; --sun:#E8A83E;
    --coral:#FF8A70; --done:#5F716C; --ok:#4FBF8A; --warn:#E8A83E;
    --s0:#3FC2B2; --s0soft:#1B3330; --s1:#FF8A70; --s1soft:#3A2523;
    --s2:#6BA8DE; --s2soft:#1F2C3A; --s3:#F0A055; --s3soft:#392C1C;
    --s4:#B98AE0; --s4soft:#2F2439;
    --hero-ink:#FFFFFF;
    --shadow:0 2px 8px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121B19; --card:#1B2725; --ink:#EAF1EE; --sub:#93A5A0;
  --line:#2A3835; --teal:#3FC2B2; --aqua:#2FA99B; --sun:#E8A83E;
  --coral:#FF8A70; --done:#5F716C; --ok:#4FBF8A; --warn:#E8A83E;
  --s0:#3FC2B2; --s0soft:#1B3330; --s1:#FF8A70; --s1soft:#3A2523;
  --s2:#6BA8DE; --s2soft:#1F2C3A; --s3:#F0A055; --s3soft:#392C1C;
  --s4:#B98AE0; --s4soft:#2F2439;
  --hero-ink:#FFFFFF;
  --shadow:0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
  line-height:1.5; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1160px; margin:0 auto; padding:0 16px 80px}

/* ---------- 히어로 ---------- */
.hero{
  margin:14px 0 0; border-radius:20px; padding:22px 22px 20px;
  background:linear-gradient(130deg, var(--teal) 0%, var(--aqua) 52%, var(--sun) 120%);
  color:var(--hero-ink); position:relative; overflow:hidden;
}
.hero::after{
  content:"🌴"; position:absolute; right:14px; bottom:-14px; font-size:88px;
  opacity:.22; transform:rotate(-8deg);
}
.hero .eyebrow{font-size:12px; letter-spacing:.16em; font-weight:800; opacity:.9}
.hero h1{font-size:26px; font-weight:900; letter-spacing:-.02em; margin:4px 0 2px; text-wrap:balance}
.hero .dates{font-size:14px; font-weight:600; opacity:.95}
.live{
  position:absolute; top:16px; right:16px;
  display:flex; align-items:center; gap:6px; font-size:12px; font-weight:800;
  background:rgba(0,0,0,.18); border-radius:99px; padding:5px 11px; color:#fff;
}
.live .dot{width:8px; height:8px; border-radius:50%; background:var(--sun)}
.live.on .dot{background:#7CFFC2}

/* ---------- 탭 + 진행률 (sticky) ---------- */
.sticky{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:10px 0; border-bottom:1px solid var(--line); margin-bottom:14px;
}
.tabs{display:flex; gap:8px}
.tab{
  flex:1; max-width:220px; border:1.5px solid var(--line); background:var(--card);
  color:var(--sub); border-radius:12px; padding:9px 0; font-size:15px; font-weight:800;
  font-family:inherit; cursor:pointer;
}
.tab.on{background:var(--teal); border-color:var(--teal); color:#fff}
.progress-row{display:flex; align-items:center; gap:10px; margin-top:10px}
.bar{flex:1; height:9px; border-radius:99px; background:var(--line); overflow:hidden}
.bar>i{display:block; height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg, var(--teal), var(--aqua), var(--sun)); transition:width .3s}
.count{font-size:13px; font-weight:800; color:var(--sub);
  font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- 검색 + 전체 추가 ---------- */
.controls{display:flex; flex-direction:column; gap:8px; margin-bottom:16px}
.search-row{position:relative}
.search-row .icon{position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:15px; pointer-events:none}
#searchInput{
  width:100%; border:1.5px solid var(--line); border-radius:12px;
  padding:11px 38px 11px 38px; font-size:15px; font-family:inherit;
  background:var(--card); color:var(--ink);
}
#searchClear{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  border:none; background:none; color:var(--sub); font-size:17px; padding:6px 9px;
  cursor:pointer; display:none;
}
.gadd-row{display:flex; gap:8px}
#gaddSection{
  border:1.5px solid var(--line); border-radius:12px; padding:0 8px; font-size:14px;
  font-family:inherit; background:var(--card); color:var(--ink); font-weight:700;
}
#gaddInput{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px;
  padding:10px 12px; font-size:15px; font-family:inherit; background:var(--card); color:var(--ink);
}
.btn{
  border:none; border-radius:12px; padding:10px 16px; font-size:14px;
  font-weight:800; font-family:inherit; cursor:pointer; background:var(--teal); color:#fff;
}
.btn.small{padding:8px 13px; border-radius:10px; flex:none}
input::placeholder{color:var(--sub)}
input:focus,select:focus{outline:2px solid var(--teal); outline-offset:-1px}

/* ---------- 섹션 그리드 (웹은 가로 배치) ---------- */
.grid{display:grid; gap:14px; grid-template-columns:1fr; align-items:start}
@media (min-width:720px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1060px){ .grid{grid-template-columns:repeat(3,1fr)} }

section.grp{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden; border-top:4px solid var(--sc);
}
.grp-head{
  display:flex; align-items:center; gap:10px;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.grp-head .emoji{
  width:34px; height:34px; border-radius:10px; background:var(--scsoft);
  display:grid; place-items:center; font-size:17px; flex:none;
}
.grp-head h2{font-size:15px; font-weight:800; letter-spacing:-.01em; flex:1}
.grp-head .gc{font-size:12px; font-weight:800; color:var(--sub); font-variant-numeric:tabular-nums}
.grp-head .gc.full{color:var(--sc)}
.add-row{display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--scsoft)}
.add-row input{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:10px; padding:8px 12px;
  font-size:14px; font-family:inherit; background:var(--card); color:var(--ink);
}
ul.items{list-style:none}
li.item{
  display:flex; align-items:center; gap:12px; padding:10px 16px;
  border-bottom:1px solid var(--line); cursor:pointer; user-select:none;
}
li.item:last-child{border-bottom:none}
li.item:active{background:var(--scsoft)}
li.item.hide{display:none}
.box{
  width:22px; height:22px; flex:none; border-radius:8px;
  border:2px solid var(--line); display:grid; place-items:center;
  transition:all .15s; background:var(--card);
}
li.item.on .box{background:var(--sc); border-color:var(--sc)}
.box svg{width:13px; height:13px; stroke:#fff; stroke-width:3; fill:none;
  stroke-linecap:round; stroke-linejoin:round; opacity:0}
li.item.on .box svg{opacity:1}
.txt{font-size:15px; flex:1}
li.item.on .txt{color:var(--done); text-decoration:line-through}
.del{
  flex:none; border:none; background:none; color:var(--sub); font-size:18px;
  padding:2px 6px; cursor:pointer; line-height:1; border-radius:6px;
}
.del:active{color:var(--coral)}
.empty-search{
  grid-column:1/-1; text-align:center; color:var(--sub); font-size:14px; padding:30px 0;
}
.new-section{
  border:2px dashed var(--line); border-radius:16px; padding:14px;
  display:flex; gap:8px; align-items:center; background:none;
}
.new-section input{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:10px;
  padding:9px 12px; font-size:14px; font-family:inherit; background:var(--card); color:var(--ink);
}

/* ---------- 일정 ---------- */
.plan-grid{display:grid; gap:14px; grid-template-columns:1fr; align-items:start}
@media (min-width:720px){ .plan-grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1060px){ .plan-grid{grid-template-columns:repeat(3,1fr)} }
.day{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:var(--shadow); overflow:hidden; border-top:4px solid var(--dc);
}
.day-head{
  display:flex; align-items:baseline; gap:8px; padding:13px 16px;
  border-bottom:1px solid var(--line);
}
.day-head .dnum{
  font-size:12px; font-weight:900; color:var(--dc); letter-spacing:.08em;
}
.day-head h2{font-size:16px; font-weight:800; flex:1}
.day-head .tag{font-size:12px; font-weight:800; color:var(--dc)}
.slots{display:block}
.slot{display:flex; border-bottom:1px dashed var(--line); min-height:32px}
.slot:last-child{border-bottom:none}
.slot-time{
  flex:none; width:56px; padding:7px 8px 0 0; font-size:11px; font-weight:800;
  color:var(--sub); text-align:right; border-right:1px solid var(--line);
  font-variant-numeric:tabular-nums;
}
.slot.filled .slot-time{color:var(--dc)}
.slot-body{flex:1; min-width:0; padding:4px 8px; display:flex; flex-direction:column; gap:4px; cursor:pointer}
.entry{
  background:var(--dcsoft); border-radius:9px; padding:6px 10px; font-size:13px;
  display:flex; gap:7px; align-items:center; cursor:pointer;
}
.entry .et{font-weight:900; color:var(--dc); font-size:11px; font-variant-numeric:tabular-nums; flex:none}
.entry .ex{flex:1; min-width:0; word-break:break-word}
.entry .pencil{flex:none; font-size:11px; opacity:.55}
.entry-edit{
  background:var(--dcsoft); border-radius:9px; padding:8px;
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
}
.entry-edit input[type=time]{
  border:1.5px solid var(--line); border-radius:8px; padding:5px 4px; font-size:12px;
  font-family:inherit; background:var(--card); color:var(--ink); width:80px;
}
.entry-edit input[type=text]{
  flex:1; min-width:120px; border:1.5px solid var(--line); border-radius:8px;
  padding:5px 9px; font-size:13px; font-family:inherit; background:var(--card); color:var(--ink);
}
.entry-edit .btn.small{padding:6px 10px; font-size:12px; border-radius:8px}
.entry-edit .btn.ghost{background:var(--card); color:var(--sub); border:1px solid var(--line)}
.entry-edit .btn.danger{background:var(--coral)}
.plan-add{display:flex; gap:6px; padding:10px 12px; background:var(--dcsoft)}
.plan-add input[type=time]{
  border:1.5px solid var(--line); border-radius:10px; padding:7px 6px; font-size:13px;
  font-family:inherit; background:var(--card); color:var(--ink); width:86px;
}
.plan-add input[type=text]{
  flex:1; min-width:0; border:1.5px solid var(--line); border-radius:10px;
  padding:7px 10px; font-size:14px; font-family:inherit; background:var(--card); color:var(--ink);
}
.plan-empty{padding:14px 16px; font-size:13px; color:var(--sub)}

/* ---------- 기타 ---------- */
.note{
  background:var(--card); border:1px dashed var(--line); border-radius:14px;
  padding:12px 14px; margin-top:18px; font-size:13px; color:var(--sub);
}
.note b{color:var(--ink)}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px);
  background:var(--ink); color:var(--bg); font-size:14px; font-weight:600;
  padding:11px 18px; border-radius:99px; transition:transform .25s; z-index:50;
  max-width:90vw; text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{margin-top:24px; text-align:center}
.foot button{background:none; border:none; color:var(--sub); font-size:12px;
  font-family:inherit; cursor:pointer; text-decoration:underline; padding:8px}
.hidden{display:none !important}
li.item:focus-visible,.tab:focus-visible,.btn:focus-visible,.foot button:focus-visible{
  outline:2px solid var(--coral); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="eyebrow">NHA TRANG · 가족여행</div>
    <h1>나트랑 여행 🌊</h1>
    <div class="dates">9/10 (목) 출발 ✈️ → 9/14 (월) 귀국 🛬 · 4박 5일</div>
    <div class="live" id="live"><span class="dot"></span><span id="liveTxt">연결 중…</span></div>
  </div>

  <div class="sticky">
    <div class="tabs">
      <button class="tab on" id="tabCheck">🧳 준비물</button>
      <button class="tab" id="tabPlan">🗓️ 일정</button>
    </div>
    <div class="progress-row" id="progressRow">
      <div class="bar"><i id="barFill"></i></div>
      <span class="count" id="totalCount">0 / 0</span>
    </div>
  </div>

  <!-- ===== 준비물 탭 ===== -->
  <div id="viewCheck">
    <div class="controls">
      <div class="search-row">
        <span class="icon">🔍</span>
        <input id="searchInput" placeholder="전체 검색 — 예: 기저귀, 선크림" autocomplete="off">
        <button id="searchClear" aria-label="검색 지우기">×</button>
      </div>
      <div class="gadd-row">
        <select id="gaddSection" aria-label="추가할 항목 선택"></select>
        <input id="gaddInput" placeholder="새 준비물 추가" autocomplete="off">
        <button class="btn" id="gaddBtn">추가</button>
      </div>
    </div>
    <div class="grid" id="sections"></div>
    <div class="note">
      👫 <b>같이 쓰는 법</b> — 이 주소를 두 분 다 즐겨찾기 해두고 열면 끝.
      한 명이 체크하면 다른 사람 화면에도 몇 초 안에 자동 반영돼요. 일정 탭도 똑같이 공유됩니다.
    </div>
    <div class="foot"><button id="resetAll">준비물 전체 초기화</button></div>
  </div>

  <!-- ===== 일정 탭 ===== -->
  <div id="viewPlan" class="hidden">
    <div class="plan-grid" id="planGrid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DB = "https://nhatrang-checklist-default-rtdb.asia-southeast1.firebasedatabase.app/lists/a899d7ed25e360e6d7e9c01d";
const DATA = [
  {name:"공통", emoji:"🧳", items:["항공권","유심","여행자보험","패스트트랙","환전","트래블카드","샤워기필터","진드기시트(다이소)","모기기피제","빨래줄","분유포트","젖병건조대","세제 및 수세미","휴대용 가위·집게","물티슈","여행용 티슈","일회용봉투","지퍼백","세면도구","빗","헤어에센스","아기띠","양산","손선풍기","보조배터리","충전기","헤드셋(준우)","래쉬가드","모자"]},
  {name:"상비약", emoji:"💊", items:["해열제","냉각패치","밴드","비판텐","체온계","기타 상비약"]},
  {name:"준우", emoji:"👶", items:["여벌옷","수영복","아쿠아슈즈","기저귀","방수기저귀","모자","양말","손수건","선글라스","얇은 블랭킷","선크림","크림","수딩젤","세면용품","유모차","빨대컵","수저","유리 내열용기","일회용 턱받이","면봉"]},
  {name:"준우 · 먹거리", emoji:"🍚", items:["김","물","주스","우유","과자","실온이유식","아기 유기농 햇반","동결건조국","곰탕 등(아이배냇)","아기 육포"]},
  {name:"준우 · 놀거리", emoji:"🧸", items:["장난감","튜브","구명조끼","무설탕 자일리톨캔디","책","애착인형","베개?","비치타올"]}
];
const DAYS = [
  {label:"9/10 (목)", tag:"출발 ✈️"},
  {label:"9/11 (금)", tag:""},
  {label:"9/12 (토)", tag:""},
  {label:"9/13 (일)", tag:""},
  {label:"9/14 (월)", tag:"귀국 🛬"}
];
const CACHE_KEY = "nhatrang-rt-cache-v2";
let state = {chk:{}, custom:{}, plan:{}, removed:{}, sections:{}};
let query = "";

function normalize(s){
  state = {chk:(s&&s.chk)||{}, custom:(s&&s.custom)||{}, plan:(s&&s.plan)||{},
    removed:(s&&s.removed)||{}, sections:(s&&s.sections)||{}};
}
try{ normalize(JSON.parse(localStorage.getItem(CACHE_KEY))); }catch(e){}

/* ---------- 서버 통신 (Firebase RTDB REST + SSE) ---------- */
function dbWrite(path, value){
  return fetch(DB + path + ".json", {
    method: value === null ? "DELETE" : "PUT",
    body: value === null ? undefined : JSON.stringify(value)
  }).then(r => { if(!r.ok) throw new Error("HTTP "+r.status); })
    .catch(() => toast("저장 실패 — 인터넷 연결을 확인해 주세요"));
}
function applyPut(path, data){
  const segs = path.split("/").filter(Boolean);
  if(segs.length === 0){ normalize(data); return; }
  let node = state;
  for(let i=0; i<segs.length-1; i++){
    if(typeof node[segs[i]] !== "object" || node[segs[i]] === null) node[segs[i]] = {};
    node = node[segs[i]];
  }
  const last = segs[segs.length-1];
  if(data === null) delete node[last]; else node[last] = data;
  normalize(state);
}
const liveEl = document.getElementById("live");
function setLive(on, txt){
  liveEl.classList.toggle("on", on);
  document.getElementById("liveTxt").textContent = txt;
}
function connect(){
  const es = new EventSource(DB + ".json");
  es.addEventListener("put", e => {
    const d = JSON.parse(e.data);
    applyPut(d.path, d.data);
    setLive(true, "실시간 연결됨");
    saveCache(); renderAll();
  });
  es.addEventListener("patch", e => {
    const d = JSON.parse(e.data);
    const base = d.path.split("/").filter(Boolean);
    Object.keys(d.data||{}).forEach(k => applyPut("/"+base.concat(k).join("/"), d.data[k]));
    saveCache(); renderAll();
  });
  es.onerror = () => setLive(false, "재연결 중…");
}
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(state)); }catch(e){} }
function localThenRemote(path, value){
  applyPut(path, value); saveCache(); renderAll(); dbWrite(path, value);
}
function newKey(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------- 준비물 렌더링 ---------- */
const secEl = document.getElementById("sections");
function matches(t){ return !query || t.toLowerCase().includes(query); }
// 기본 5개 + 직접 추가한 대분류를 합쳐 한 목록으로
function sectionList(){
  const base = DATA.map((sec,si)=>({id:si, name:sec.name, emoji:sec.emoji, color:si, items:sec.items, custom:false}));
  const cust = Object.entries(state.sections).filter(([k,v])=>v)
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,v],i)=>({id:k, name:v.n, emoji:v.e||"📦", color:(5+i)%5, items:[], custom:true}));
  return base.concat(cust);
}
function renderCheck(){
  secEl.innerHTML = "";
  let anyVisible = false;
  sectionList().forEach(sec=>{
    const customs = Object.entries(state.custom).filter(([k,c])=>c && c.s===sec.id);
    const baseItems = sec.custom ? [] :
      sec.items.map((t,ii)=>[t,ii]).filter(([t,ii])=>!state.removed[sec.id+"-"+ii]);
    const total = baseItems.length + customs.length;
    let done = 0, visibleCount = 0;

    const box = document.createElement("section");
    box.className = "grp";
    box.style.setProperty("--sc", "var(--s"+sec.color+")");
    box.style.setProperty("--scsoft", "var(--s"+sec.color+"soft)");

    const head = document.createElement("div");
    head.className = "grp-head";
    const ul = document.createElement("ul");
    ul.className = "items";

    baseItems.forEach(([t, ii])=>{
      const id = sec.id+"-"+ii, on = !!state.chk[id];
      if(on) done++;
      const li = makeItem(t, on,
        ()=> localThenRemote("/chk/"+id, on?null:true),
        ()=> localThenRemote("/removed/"+id, true));
      if(!matches(t)) li.classList.add("hide"); else visibleCount++;
      ul.appendChild(li);
    });
    customs.forEach(([key, c])=>{
      if(c.c) done++;
      const li = makeItem(c.t, !!c.c,
        ()=> localThenRemote("/custom/"+key+"/c", c.c?null:true),
        ()=> localThenRemote("/custom/"+key, null));
      if(!matches(String(c.t))) li.classList.add("hide"); else visibleCount++;
      ul.appendChild(li);
    });

    head.innerHTML = "<span class='emoji'>"+sec.emoji+"</span><h2>"+esc(sec.name)+"</h2>"
      + "<span class='gc"+(done===total&&total>0?" full":"")+"'>"+done+" / "+total+"</span>";
    if(sec.custom){
      // 직접 만든 대분류는 삭제 가능 (항목이 있으면 두 번 눌러 확정)
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "×";
      del.setAttribute("aria-label", sec.name+" 대분류 삭제");
      let armed = false, timer;
      del.addEventListener("click", ()=>{
        if(customs.length > 0 && !armed){
          armed = true; del.textContent = "확인";
          toast("항목 "+customs.length+"개가 같이 지워져요 — [확인]을 한 번 더 누르면 삭제");
          timer = setTimeout(()=>{ armed=false; del.textContent="×"; }, 4000);
          return;
        }
        clearTimeout(timer);
        customs.forEach(([key])=>{ applyPut("/custom/"+key, null); dbWrite("/custom/"+key, null); });
        localThenRemote("/sections/"+sec.id, null);
      });
      head.appendChild(del);
    }
    box.appendChild(head);

    // 항목 추가 - 섹션 상단 (버튼 + 엔터 둘 다)
    const add = document.createElement("div");
    add.className = "add-row";
    const inp = document.createElement("input");
    inp.placeholder = "+ "+sec.name+" 항목 추가";
    const addBtn = document.createElement("button");
    addBtn.className = "btn small"; addBtn.textContent = "추가";
    addBtn.style.background = "var(--sc)";
    const submitSec = ()=>{
      if(!inp.value.trim()) return;
      localThenRemote("/custom/"+newKey(), {s:sec.id, t:inp.value.trim(), c:false});
    };
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") submitSec(); });
    addBtn.addEventListener("click", submitSec);
    add.appendChild(inp); add.appendChild(addBtn);
    box.appendChild(add);
    box.appendChild(ul);

    if(query && visibleCount===0) box.classList.add("hidden");
    else anyVisible = true;
    secEl.appendChild(box);
  });

  // 새 대분류 추가 카드
  const nsCard = document.createElement("div");
  nsCard.className = "new-section";
  const nsInp = document.createElement("input");
  nsInp.placeholder = "+ 새 대분류 이름 (예: 엄마아빠 옷)";
  const nsBtn = document.createElement("button");
  nsBtn.className = "btn small"; nsBtn.textContent = "대분류 추가";
  const nsSubmit = ()=>{
    const n = nsInp.value.trim();
    if(!n) return;
    localThenRemote("/sections/"+newKey(), {n:n});
    toast("\""+n+"\" 대분류를 만들었어요");
  };
  nsInp.addEventListener("keydown", e=>{ if(e.key==="Enter") nsSubmit(); });
  nsBtn.addEventListener("click", nsSubmit);
  nsCard.appendChild(nsInp); nsCard.appendChild(nsBtn);
  if(!query) secEl.appendChild(nsCard);

  if(query && !anyVisible){
    const em = document.createElement("div");
    em.className = "empty-search";
    em.textContent = "\""+query+"\" 검색 결과가 없어요";
    secEl.appendChild(em);
  }
  rebuildGaddOptions();
  updateTotal();
}
function makeItem(text, on, onToggle, onDel){
  const li = document.createElement("li");
  li.className = "item"+(on?" on":"");
  li.tabIndex = 0;
  li.setAttribute("role","checkbox");
  li.setAttribute("aria-checked", on);
  li.setAttribute("aria-label", text);
  li.innerHTML = "<span class='box'><svg viewBox='0 0 16 16'><polyline points='2.5,8.5 6.5,12.5 13.5,4'/></svg></span><span class='txt'>"+esc(text)+"</span>";
  if(onDel){
    const d = document.createElement("button");
    d.className = "del"; d.textContent = "×"; d.setAttribute("aria-label","삭제");
    d.addEventListener("click", e=>{ e.stopPropagation(); onDel(); });
    li.appendChild(d);
  }
  li.addEventListener("click", onToggle);
  li.addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); onToggle(); }});
  return li;
}
function updateTotal(){
  let total=0, done=0;
  DATA.forEach((sec,si)=>{
    sec.items.forEach((_,ii)=>{
      if(state.removed[si+"-"+ii]) return;
      total++;
      if(state.chk[si+"-"+ii]) done++;
    });
  });
  Object.values(state.custom).forEach(c=>{ if(!c) return; total++; if(c.c) done++; });
  document.getElementById("totalCount").textContent = done+" / "+total;
  document.getElementById("barFill").style.width = total?Math.round(done/total*100)+"%":"0%";
}

/* ---------- 일정 렌더링 (시간별 표) ---------- */
const planEl = document.getElementById("planGrid");
const DAYCOLOR = ["s0","s2","s3","s4","s1"];
let editing = null; // {di, key, draftT, draftX, focusPending}

function makeEntry(di, key, en){
  if(editing && editing.di===di && editing.key===key){
    // 수정 모드
    const form = document.createElement("div");
    form.className = "entry-edit";
    const time = document.createElement("input");
    time.type = "time"; time.value = editing.draftT;
    time.addEventListener("input", ()=>{ editing.draftT = time.value; });
    const txt = document.createElement("input");
    txt.type = "text"; txt.value = editing.draftX;
    txt.addEventListener("input", ()=>{ editing.draftX = txt.value; });
    const save = document.createElement("button");
    save.className = "btn small"; save.textContent = "저장";
    save.style.background = "var(--dc)";
    const doSave = ()=>{
      if(!editing.draftX.trim()) return;
      const v = {t:editing.draftT||"", x:editing.draftX.trim()};
      editing = null;
      localThenRemote("/plan/d"+di+"/"+key, v);
    };
    save.addEventListener("click", doSave);
    txt.addEventListener("keydown", e=>{ if(e.key==="Enter") doSave(); });
    const del = document.createElement("button");
    del.className = "btn small danger"; del.textContent = "삭제";
    del.addEventListener("click", ()=>{
      editing = null;
      localThenRemote("/plan/d"+di+"/"+key, null);
    });
    const cancel = document.createElement("button");
    cancel.className = "btn small ghost"; cancel.textContent = "취소";
    cancel.addEventListener("click", ()=>{ editing = null; renderPlan(); });
    form.appendChild(time); form.appendChild(txt);
    form.appendChild(save); form.appendChild(del); form.appendChild(cancel);
    if(editing.focusPending){
      editing.focusPending = false;
      setTimeout(()=>txt.focus(), 0);
    }
    return form;
  }
  // 보기 모드 - 탭하면 수정
  const chip = document.createElement("div");
  chip.className = "entry";
  chip.setAttribute("role","button");
  chip.setAttribute("aria-label", en.x+" 수정");
  chip.innerHTML = (en.t ? "<span class='et'>"+en.t+"</span>" : "")
    + "<span class='ex'>"+esc(en.x)+"</span><span class='pencil'>✏️</span>";
  chip.addEventListener("click", e=>{
    e.stopPropagation();
    editing = {di, key, draftT:en.t||"", draftX:en.x, focusPending:true};
    renderPlan();
  });
  return chip;
}

function makeSlot(di, label, list, prefill, timeInp, txtInp){
  const row = document.createElement("div");
  row.className = "slot" + (list.length ? " filled" : "");
  const tl = document.createElement("div");
  tl.className = "slot-time"; tl.textContent = label;
  const body = document.createElement("div");
  body.className = "slot-body";
  list.forEach(([key, en])=> body.appendChild(makeEntry(di, key, en)));
  // 빈 칸을 탭하면 그 시간이 추가칸에 자동 입력
  body.addEventListener("click", e=>{
    if(e.target !== body) return;
    if(prefill) timeInp.value = prefill;
    txtInp.focus();
  });
  row.appendChild(tl); row.appendChild(body);
  return row;
}

function renderPlan(){
  planEl.innerHTML = "";
  DAYS.forEach((day, di)=>{
    const card = document.createElement("div");
    card.className = "day";
    card.style.setProperty("--dc", "var(--"+DAYCOLOR[di]+")");
    card.style.setProperty("--dcsoft", "var(--"+DAYCOLOR[di]+"soft)");

    const head = document.createElement("div");
    head.className = "day-head";
    head.innerHTML = "<span class='dnum'>DAY "+(di+1)+"</span><h2>"+day.label+"</h2>"
      + (day.tag ? "<span class='tag'>"+day.tag+"</span>" : "");
    card.appendChild(head);

    // 일정 추가 - 카드 상단
    const add = document.createElement("div");
    add.className = "plan-add";
    const time = document.createElement("input");
    time.type = "time"; time.setAttribute("aria-label","시간(선택)");
    const inp = document.createElement("input");
    inp.type = "text"; inp.placeholder = "+ 일정 추가";
    const submit = ()=>{
      if(!inp.value.trim()) return;
      localThenRemote("/plan/d"+di+"/"+newKey(), {t:time.value||"", x:inp.value.trim()});
    };
    const addBtn = document.createElement("button");
    addBtn.className = "btn small"; addBtn.textContent = "추가";
    addBtn.style.background = "var(--dc)";
    addBtn.addEventListener("click", submit);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
    add.appendChild(time); add.appendChild(inp); add.appendChild(addBtn);
    card.appendChild(add);

    // 시간별 표: 00~23시 전체 (야간 비행 대비)
    const entries = Object.entries((state.plan||{})["d"+di]||{}).filter(([k,v])=>v);
    const noTime = entries.filter(([k,en])=>!en.t).sort((a,b)=>a[0].localeCompare(b[0]));
    const byHour = {};
    entries.filter(([k,en])=>en.t).forEach(([k,en])=>{
      const h = parseInt(en.t, 10);
      (byHour[h] = byHour[h] || []).push([k,en]);
    });
    Object.values(byHour).forEach(arr=>arr.sort((a,b)=>a[1].t.localeCompare(b[1].t)));
    const start = 0, end = 23;

    const table = document.createElement("div");
    table.className = "slots";
    if(noTime.length) table.appendChild(makeSlot(di, "미정", noTime, "", time, inp));
    for(let h=start; h<=end; h++){
      const label = String(h).padStart(2,"0")+":00";
      table.appendChild(makeSlot(di, label, byHour[h]||[], label, time, inp));
    }
    card.appendChild(table);
    planEl.appendChild(card);
  });
}
function renderAll(){ renderCheck(); renderPlan(); }

/* ---------- 검색 ---------- */
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");
searchInput.addEventListener("input", ()=>{
  query = searchInput.value.trim().toLowerCase();
  searchClear.style.display = query ? "block" : "none";
  renderCheck();
});
searchClear.addEventListener("click", ()=>{
  searchInput.value = ""; query = "";
  searchClear.style.display = "none";
  renderCheck(); searchInput.focus();
});

/* ---------- 전체 추가 (섹션 선택 + 입력) ---------- */
const gaddSection = document.getElementById("gaddSection");
function rebuildGaddOptions(){
  const prev = gaddSection.value;
  gaddSection.innerHTML = "";
  sectionList().forEach(sec=>{
    const o = document.createElement("option");
    o.value = String(sec.id); o.textContent = sec.emoji+" "+sec.name;
    gaddSection.appendChild(o);
  });
  if([...gaddSection.options].some(o=>o.value===prev)) gaddSection.value = prev;
}
const gaddInput = document.getElementById("gaddInput");
function gadd(){
  if(!gaddInput.value.trim()) return;
  const v = gaddSection.value;
  const s = /^\d+$/.test(v) ? +v : v; // 기본 대분류는 번호, 직접 만든 대분류는 키
  localThenRemote("/custom/"+newKey(), {s:s, t:gaddInput.value.trim(), c:false});
  gaddInput.value = "";
  toast("추가했어요");
}
document.getElementById("gaddBtn").addEventListener("click", gadd);
gaddInput.addEventListener("keydown", e=>{ if(e.key==="Enter") gadd(); });

/* ---------- 탭 ---------- */
const tabCheck = document.getElementById("tabCheck"), tabPlan = document.getElementById("tabPlan");
function showTab(which){
  const isPlan = which==="plan";
  tabCheck.classList.toggle("on", !isPlan);
  tabPlan.classList.toggle("on", isPlan);
  document.getElementById("viewCheck").classList.toggle("hidden", isPlan);
  document.getElementById("viewPlan").classList.toggle("hidden", !isPlan);
  document.getElementById("progressRow").classList.toggle("hidden", isPlan);
  history.replaceState(null,"", isPlan ? "#plan" : location.pathname);
}
tabCheck.addEventListener("click", ()=>showTab("check"));
tabPlan.addEventListener("click", ()=>showTab("plan"));
if(location.hash==="#plan") showTab("plan");

/* ---------- 기타 ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}
// 준비물 전체 초기화 (두 번 눌러 확정, 일정은 유지)
let resetArmed = false, resetTimer;
document.getElementById("resetAll").addEventListener("click", function(){
  if(!resetArmed){
    resetArmed = true; this.textContent = "정말 초기화할까요? 두 사람 모두 지워져요 — 한 번 더";
    resetTimer = setTimeout(()=>{ resetArmed=false; this.textContent="준비물 전체 초기화"; }, 4000);
  }else{
    clearTimeout(resetTimer); resetArmed = false;
    state.chk = {}; state.custom = {}; state.removed = {}; state.sections = {}; saveCache(); renderAll();
    dbWrite("/chk", null); dbWrite("/custom", null); dbWrite("/removed", null); dbWrite("/sections", null);
    this.textContent = "준비물 전체 초기화"; toast("초기화했어요 (기본 목록으로 복구)");
  }
});

renderAll();
connect();
</script>
